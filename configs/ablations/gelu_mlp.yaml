model:
  dim: 384
  n_layers: 6
  n_heads: 6
  n_kv_heads: 3
  vocab_size: 8192
  max_seq_len: 512
  mlp: gelu
train:
  train_bin: data/tinystories/train.bin
  val_bin: data/tinystories/val.bin
  tokenizer_path: data/tinystories/tokenizer.json
  batch_size: 24
  grad_accum_steps: 6
  max_steps: 1200
  lr: 0.0006
  min_lr: 6.0e-05
  warmup_steps: 150
  dtype: bfloat16
  compile: true
  eval_interval: 200
  eval_iters: 50
  log_interval: 25
  out_dir: checkpoints/ablations/gelu_mlp
  run_name: abl_gelu_mlp
