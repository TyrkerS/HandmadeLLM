# ~113M params flagship (dim 768, 16 layers, GQA 12q/4kv, ctx 1024, vocab 16k).
# Needs the Phase 2 efficiency stack (bf16 + grad accum + checkpointing) to fit in 12 GB.
model:
  dim: 768
  n_layers: 16
  n_heads: 12
  n_kv_heads: 4
  vocab_size: 16384
  max_seq_len: 1024
  rope_theta: 10000.0
  dropout: 0.0

train:
  train_bin: data/tinystories16k/train.bin
  val_bin: data/tinystories16k/val.bin
  tokenizer_path: data/tinystories16k/tokenizer.json
  batch_size: 20
  grad_accum_steps: 8          # effective batch = 20*8*1024 = 164k tokens
  max_steps: 4000              # ~655M tokens — TinyStories converges well before 1B
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 300
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: bfloat16
  compile: true
  grad_checkpointing: true
  out_dir: checkpoints/flagship_113m
  eval_interval: 500
  eval_iters: 50
  log_interval: 10
  run_name: flagship_113m
